[package]
name = "reqman"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reqman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# reqwest: 发 HTTP 请求。用 rustls-tls(纯 Rust 实现,不依赖系统 OpenSSL,跨平台编译最稳)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "multipart"] }
# percent-encoding: 自己拼 URL 的查询参数(RFC 3986 风格,空格→%20)
percent-encoding = "2"
tauri-plugin-dialog = "2"

[dev-dependencies]
# 仅测试用:提供 #[tokio::test] 宏和多线程 runtime 跑 async 测试
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

